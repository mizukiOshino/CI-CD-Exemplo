  # ============================================================
  # HOTFIX
  # ============================================================

  hotfix:
    name: "CI - Hotfix"
    if: startsWith(github.ref, 'refs/heads/hotfix') || startsWith(github.base_ref, 'hotfix')
    runs-on: ubuntu-latest
