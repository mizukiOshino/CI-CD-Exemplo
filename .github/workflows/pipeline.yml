name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - uat
      - master
      - hotfix
      - 'hotfix/**'

  pull_request:
    branches:
      - develop
      - uat
      - master
      - hotfix
      - 'hotfix/**'

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: "my-application"

jobs:

  # ============================================================
  # DEVELOP
  # ============================================================

  develop:
    name: "CI - Develop"
    if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Pre-build
        run: |
          echo "Checking Python and Node/npm versions"
          python --version || echo "Python not found"
          node --version || echo "Node not found"
          npm --version || echo "npm not found"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build
        env:
          PYTHONPATH: src
        run: |
          ls -R
          python -c "import sys; print(sys.executable); print(sys.path)"
          pytest tests \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
          docker build -t "${IMAGE_NAME}:develop-${GITHUB_SHA}" .

      # Using runner's Node/npm; explicit setup removed for simplicity

      - name: Post-build
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN not set, skipping Snyk scans"
            exit 0
          fi
          npx --yes snyk auth "$SNYK_TOKEN"
          npx --yes snyk test --file=requirements.txt --package-manager=pip --json > snyk-deps.json || true
          if [ -f snyk-deps.json ]; then
            deps_count=$(jq '.vulnerabilities | length' snyk-deps.json 2>/dev/null || echo 0)
            echo "Snyk dependency vulnerabilities found: $deps_count"
          else
            echo "snyk deps did not produce snyk-deps.json"
          fi
          npx --yes snyk container test "${IMAGE_NAME}:develop-${GITHUB_SHA}" --json > snyk-image.json || true
          if [ -f snyk-image.json ]; then
            image_count=$(jq '.vulnerabilities | length' snyk-image.json 2>/dev/null || echo 0)
            echo "Snyk image vulnerabilities found: $image_count"
          else
            echo "snyk image did not produce snyk-image.json"
          fi

      - name: Post-deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-develop
          path: |
            coverage.xml
            snyk-deps.json
            snyk-image.json
          if-no-files-found: ignore


  # ============================================================
  # UAT
  # ============================================================

  uat:
