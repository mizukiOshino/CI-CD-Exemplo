name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - uat
      - master
      - hotfix
      - 'hotfix/**'

  pull_request:
    branches:
      - develop
      - uat
      - master
      - hotfix
      - 'hotfix/**'

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: "my-application"

jobs:

  # ============================================================
  # DEVELOP
  # ============================================================

  develop:
    name: "CI - Develop"
    if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # -------------------------
      # TESTS
      # -------------------------

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          ls -R
          python -c "import sys; print(sys.executable); print(sys.path)"
          pytest tests \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      # -------------------------
      # BUILD
      # -------------------------

      - name: Docker build
        run: |
          docker build \
            -t "${IMAGE_NAME}:develop-${GITHUB_SHA}" \
            .

      - name: Snyk dependency and image scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN not set, skipping Snyk scans"
            exit 0
          fi
          curl -sL https://static.snyk.io/cli/latest/install.sh | sh
          ./snyk auth "$SNYK_TOKEN"
          ./snyk test --file=requirements.txt --package-manager=pip --json > snyk-deps.json || true
          echo "Snyk dependency summary (full JSON uploaded as artifact):"
          if [ -f snyk-deps.json ]; then
            jq -r '.vulnerabilities[] | .id + " " + .title + " " + (.package.name // "") + " " + (.package.version // "") + " " + (.url // "")' snyk-deps.json || cat snyk-deps.json
          else
            echo "snyk deps did not produce snyk-deps.json"
          fi
          ./snyk container test "${IMAGE_NAME}:develop-${GITHUB_SHA}" --json > snyk-image.json || true
          echo "Snyk image summary (full JSON uploaded as artifact):"
          if [ -f snyk-image.json ]; then
            jq -r '.vulnerabilities[] | .id + " " + .title + " " + (.package // "") + " " + (.version // "") + " " + (.url // "")' snyk-image.json || cat snyk-image.json
          else
            echo "snyk image did not produce snyk-image.json"
          fi

      # -------------------------
      # VULNERABILITIES
      # -------------------------

      - name: Dependency vulnerability scan
        run: |
          pip-audit --format=json --output=pip-audit.json || true
          echo "pip-audit summary (full JSON uploaded as artifact):"
          if [ -f pip-audit.json ]; then
            jq -r '.vulnerabilities[] | .name + " " + .version + ": " + (.vulns[]?.id // "") + " " + (.vulns[]?.url // "")' pip-audit.json || cat pip-audit.json
          else
            echo "pip-audit did not produce pip-audit.json"
          fi

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Trivy vulnerability scan
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format table || true

      # -------------------------
      # REPORTS
      # -------------------------

      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-develop
          path: |
            coverage.xml
            pip-audit.json
            snyk-deps.json
            snyk-image.json
          if-no-files-found: ignore


